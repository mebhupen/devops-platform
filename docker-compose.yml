services:
  db:
    image: postgres:16-alpine
    container_name: enterprise-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: task_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: StrongPassword123!
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d task_management"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: enterprise-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./app/backend
    container_name: enterprise-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ./app/backend/.env
    environment:
      DATABASE_URL: postgres://postgres:StrongPassword123!@db:5432/task_management
      REDIS_URL: redis://redis:6379
      PORT: 3000
    ports:
      - "5000:3000"

  frontend:
    build:
      context: ./app/frontend
    container_name: enterprise-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: http://localhost:5000/api/v1

  nginx:
    image: nginx:alpine
    container_name: enterprise-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_data:
